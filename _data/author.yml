# ---------------------------------------------------------------------------
# Profile shown in the top bar of _layouts/home.html and in the About hero
# at the top of _pages/about.md.
#
# This lives in _data/ rather than _config.yml on purpose: Jekyll reloads
# _data files while `jekyll serve` is running, but reads _config.yml only once
# at startup. Editing this file shows up on the next refresh - no restart.
# ---------------------------------------------------------------------------

name:    "Sang Yeon Yoon"
# Two fields rather than one string: the About hero joins them as
# "<role>, <affiliation>", and either can be dropped on its own.
role:        "Undergraduate"
affiliation: "Pukyong National University"
photo:   /images/profile.jpg      # site-root path, or leave blank for a placeholder

# Contact links under the About text. Only the ones with a value are rendered.
email:    "yskite09@gmail.com"
github:   "Glesep"                # username only
linkedin: "sang-yeon-yoon-96316241b"  # username only, the part after
                                      # linkedin.com/in/ . Blank = no link.

# Kept out of the link row for now. Fill one in, then uncomment its line in
# the Liquid comment block inside the .about-links paragraph of _pages/about.md.
scholar:                          # full URL
orcid:                            # full URL
cv:                               # e.g. /files/cv.pdf

# Social preview image for link unfurls, e.g. /images/og.png
og_image:
