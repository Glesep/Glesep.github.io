# Sections of the single home page, in order. Rendered as the sidebar table
# of contents by _layouts/home.html.
#
# Optional `short:` overrides what the sidebar shows, for when a section heading
# is longer than the rail wants.
#
# An entry with `requires:` only appears when _data/publications.yml has at
# least one item whose `section` matches it.
main:
  - title: "About"
    url: "#about"

  - title: "Research Interests"
    url: "#interests"

  - title: "Education"
    url: "#education"

  - title: "Experiences"
    url: "#experiences"

  - title: "Selected Publications"
    short: "Publications"
    url: "#publications"
    requires: conference
