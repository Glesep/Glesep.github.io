# ---------------------------------------------------------------------------
# Site settings.
#
# Jekyll reads this file once at startup, so a change here needs the server
# restarted. Anything edited often lives in _data/ instead - the profile is in
# _data/author.yml, the sections in _data/navigation.yml, papers in
# _data/publications.yml.
# ---------------------------------------------------------------------------

locale                   : "en-US"
title                    : "Sang Yeon Yoon"
name                     : "Sang Yeon Yoon"
description              : "Undergraduate researcher working on the internal representations and information-processing mechanisms of multimodal large language models."

url                      : https://Glesep.github.io
baseurl                  : ""
repository               : "Glesep/Glesep.github.io"


# Reading files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .bundle
  - .devcontainer
  - .jekyll-cache
  - .sass-cache
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Every page uses the single custom layout; there are no collections.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: home


# Outputting
permalink: /:title/
timezone: Etc/UTC


# Plugins. jekyll-feed, jekyll-gist, jekyll-paginate and jemoji were dropped
# along with the blog; nothing renders their output any more.
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
